name: Build AF4 AI Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'server.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
concurrency:
  group: af4-ai-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare app and install Capacitor
        run: |
          npm install
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/assets sharp
          mkdir -p www resources
          node --input-type=module -e "import sharp from 'sharp'; await sharp('icon.svg').resize(1024,1024).png().toFile('resources/icon.png'); await sharp({create:{width:2732,height:2732,channels:4,background:'#11121a'}}).png().toFile('resources/splash.png')"
          cp index.html app.js styles.css manifest.webmanifest icon.svg sw.js www/
          rm -rf android
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
      - name: Verify Android target SDK and package identity
        run: |
          grep -q "targetSdk 35" android/app/build.gradle
          grep -q "applicationId 'com.af4.ai'" android/app/build.gradle
          echo "Android target SDK and AF4 AI application ID verified."
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Prepare public APK name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AF4-AI.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AF4-AI-Android-APK
          path: AF4-AI.apk
          if-no-files-found: error
          retention-days: 30
      - name: Verify this build matches the latest main commit
        id: latest
        run: |
          latest=$(curl -fsSL https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main | jq -r '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then echo "is_latest=true" >> "$GITHUB_OUTPUT"; else echo "is_latest=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish latest APK download
        if: steps.latest.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: AF4 AI Android (Latest)
          body: "نسخه اندروید AF4 AI. این APK با امضای آزمایشی GitHub Actions ساخته می‌شود؛ هشدارهای Play Protect ممکن است همچنان نمایش داده شوند."
          files: AF4-AI.apk
          overwrite_files: true
          make_latest: true
