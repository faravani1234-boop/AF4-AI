name: Build AF4 AI Android Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'android/**'
      - '.github/workflows/build-android-preview.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare app web assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css app.js android/app/src/main/assets/www/

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AF4-AI-Android-Preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
