name: Build AF4 AI for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'electron/**'
      - '.github/workflows/windows-desktop.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm install --save-dev electron electron-builder
      - run: npm pkg set main=electron/main.cjs
      - run: npm pkg set scripts.desktop:win="electron-builder --win nsis"
      - run: npm pkg set build.appId=com.af4.ai.desktop build.productName="AF4 AI" build.win.target=nsis
      - run: npm run desktop:win
      - uses: actions/upload-artifact@v4
        with:
          name: AF4-AI-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
